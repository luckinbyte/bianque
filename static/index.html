<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>扁鹊 — 源码分析</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // 预载主题，避免刷新闪烁。默认夜诊暖暗。
    try {
      var t = localStorage.getItem("bianque.theme") || "night";
      if (t !== "night" && t !== "paper") t = "night";
      document.documentElement.className = "theme-" + t;
    } catch (e) {
      document.documentElement.className = "theme-night";
    }
  </script>
</head>
<body>
  <header>
    <div class="hdr-left">
      <div class="brand-seal" aria-hidden="true"><span>扁</span><span>鹊</span></div>
      <div class="brand-text">
        <h1>扁鹊</h1>
        <div class="brand-tag">望 · 闻 · 问 · 切</div>
      </div>
      <span id="status" class="status idle">空闲</span>
    </div>
    <div class="hdr-right">
      <div class="ctx-meter" id="ctxMeter" title="上下文窗口用量">
        <span class="ctx-label">脉</span>
        <span class="pulse-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span id="ctxText" class="ctx-text">—</span>
      </div>
      <button id="themeBtn" type="button" class="seal-btn" title="切换昼/夜主题">昼</button>
      <button id="settingsBtn" type="button" class="seal-btn" title="设置">设</button>
      <button id="resetBtn" type="button" class="seal-btn ghost" title="重置">↻</button>
    </div>
  </header>

  <!-- 设置面板 -->
  <section id="settings" class="panel hidden">
    <h2>设置(仅保存在本浏览器)</h2>
    <p class="hint">分析目录、模型等服务端已统一配置,所有人共用。这里只需填你自己的 API Key:仅随会话发到服务端、按会话存内存,不落盘、不进日志。</p>
    <label>API Key
      <input type="password" id="cfgApikey" autocomplete="off" placeholder="sk-…">
    </label>
    <div class="actions">
      <button id="saveSettingsBtn" type="button" class="primary">保存</button>
      <button id="clearSettingsBtn" type="button" class="danger">清除</button>
      <button id="closeSettingsBtn" type="button" class="ghost">关闭</button>
    </div>
  </section>

  <!-- 主界面 -->
  <main id="main">
    <div class="frame">
      <div id="transcript"></div>
    </div>

    <div id="clarifyBox" class="clarify hidden">
      <div class="clarify-q" id="clarifyQ"></div>
      <textarea id="clarifyInput" rows="2" placeholder="补充说明…"></textarea>
      <button id="clarifySendBtn" type="button" class="primary">回答</button>
    </div>

    <form id="composer">
      <span class="composer-seal" aria-hidden="true">问</span>
      <textarea id="question" rows="2" placeholder="述其详…"></textarea>
      <button id="sendBtn" type="submit" class="primary">发送</button>
      <button id="stopBtn" type="button" class="danger hidden">停止</button>
    </form>
  </main>

  <!-- 告示浮层(医馆满员等阻塞提示) -->
  <div id="notice" class="notice hidden" role="alertdialog" aria-modal="true" aria-labelledby="noticeTitle">
    <div class="notice-card">
      <div class="notice-head">
        <span class="notice-seal" aria-hidden="true">满</span>
        <span class="notice-title" id="noticeTitle">告示</span>
      </div>
      <div class="notice-body" id="noticeBody">现在医馆内人员过多，请稍后再来。</div>
      <div class="notice-actions">
        <button id="noticeRetry" type="button" class="primary">再候片刻</button>
        <button id="noticeClose" type="button" class="ghost">关闭</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
