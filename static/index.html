<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>扁鹊 — 源码分析</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="hdr-left">
      <h1>扁鹊 <svg viewBox="0 0 24 24" width="20" height="20" role="img" aria-label="葫芦" style="display:inline-block; vertical-align:middle; transform:rotate(20deg)"><rect x="11.3" y="1.6" width="1.4" height="2" rx="0.7" fill="currentColor"/><circle cx="12" cy="6.5" r="3.2" fill="currentColor"/><circle cx="12" cy="15" r="6" fill="currentColor"/></svg></h1>
      <span id="status" class="status idle">空闲</span>
    </div>
    <div class="hdr-right">
      <div class="ctx-meter">
        <span class="ctx-label">上下文</span>
        <progress id="ctxProgress" class="ctx-progress" max="100" value="0"></progress>
        <span id="ctxText" class="ctx-text">—</span>
      </div>
      <button id="settingsBtn" type="button">⚙ 设置</button>
      <button id="resetBtn" type="button" class="ghost">↻ 重置</button>
    </div>
  </header>

  <!-- 设置面板 -->
  <section id="settings" class="panel hidden">
    <h2>设置(仅保存在本浏览器)</h2>
    <p class="hint">分析目录、模型等服务端已统一配置,所有人共用。这里只需填你自己的 API Key:仅随会话发到服务端、按会话存内存,不落盘、不进日志。</p>
    <label>API Key
      <input type="password" id="cfgApikey" autocomplete="off" placeholder="sk-…">
    </label>
    <div class="actions">
      <button id="saveSettingsBtn" type="button" class="primary">保存</button>
      <button id="clearSettingsBtn" type="button" class="danger">清除</button>
      <button id="closeSettingsBtn" type="button" class="ghost">关闭</button>
    </div>
  </section>

  <!-- 主界面 -->
  <main id="main">
    <div id="transcript"></div>

    <div id="clarifyBox" class="clarify hidden">
      <div class="clarify-q" id="clarifyQ"></div>
      <textarea id="clarifyInput" rows="2" placeholder="补充说明…"></textarea>
      <button id="clarifySendBtn" type="button" class="primary">回答</button>
    </div>

    <form id="composer">
      <textarea id="question" rows="2" placeholder="问点关于这个代码库的…"></textarea>
      <button id="sendBtn" type="submit" class="primary">发送</button>
      <button id="stopBtn" type="button" class="danger hidden">停止</button>
    </form>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
